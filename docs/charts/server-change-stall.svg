<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" class="ch-server-change-stall" role="img" aria-labelledby="ch-server-change-stall-t ch-server-change-stall-d" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title id="ch-server-change-stall-t">Смена сервера внутри канала: самый долгий простой клиента LAN / Server change inside a channel: longest LAN client stall in a run</title>
<desc id="ch-server-change-stall-d">2.1.0-alpha1 менял сервер вне пары (простой 7,1 с); с 2.1.0-alpha2 Auto меняет его сам — 0,2 с. 2.1.0-alpha1 changed the server outside the pair (7.1 s stall); since 2.1.0-alpha2 Auto changes it itself — 0.2 s. Log scale, seconds. HomenS.AI Auto VPN</desc>
<style>.ch-server-change-stall{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--mut:#6f6d68;--grid:#e1e0d9;--axis:#c3c2b7;--surf:#fcfcfb;--era:#f1f0ec}@media (prefers-color-scheme:dark){.ch-server-change-stall{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#f0efec;--ink2:#c3c2b7;--mut:#a3a19a;--grid:#2c2c2a;--axis:#383835;--surf:#1a1a19;--era:#222220}}.ch-server-change-stall .bg{fill:var(--surf)}.ch-server-change-stall .era{fill:var(--era)}.ch-server-change-stall .gr{stroke:var(--grid);stroke-width:1}.ch-server-change-stall .ax{stroke:var(--axis);stroke-width:1}.ch-server-change-stall text{fill:var(--ink2);font-size:11.5px}.ch-server-change-stall .h1{fill:var(--ink);font-size:16px;font-weight:600}.ch-server-change-stall .h2{fill:var(--ink2);font-size:13px}.ch-server-change-stall .nt{fill:var(--mut);font-size:12px}.ch-server-change-stall .lg{fill:var(--ink);font-size:12.5px}.ch-server-change-stall .tk{fill:var(--mut);font-size:11px}.ch-server-change-stall .dl{fill:var(--ink);font-size:12px;font-weight:600}.ch-server-change-stall .s1{stroke:var(--s1)}.ch-server-change-stall .s2{stroke:var(--s2)}.ch-server-change-stall .s3{stroke:var(--s3)}.ch-server-change-stall .f1{fill:var(--s1)}.ch-server-change-stall .f2{fill:var(--s2)}.ch-server-change-stall .f3{fill:var(--s3)}.ch-server-change-stall .srf{fill:var(--surf)}.ch-server-change-stall .ring{stroke:var(--surf);stroke-width:2}.ch-server-change-stall .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ch-server-change-stall .gap{fill:none;stroke-width:1;opacity:.35}.ch-server-change-stall .wh{stroke-width:1.5;stroke-linecap:round}.ch-server-change-stall .wh.weak{stroke-dasharray:3 3;opacity:.45}.ch-server-change-stall .hit{fill:transparent}.ch-server-change-stall .pt:focus{outline:none}.ch-server-change-stall .pt:focus .hit,.ch-server-change-stall .pt:hover .hit{fill:var(--grid)}</style>
