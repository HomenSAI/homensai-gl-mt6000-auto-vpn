<style>.ch-server-failure{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--ink:#0b0b0b;--ink2:#52514e;--mut:#6f6d68;--grid:#e1e0d9;--axis:#c3c2b7;--surf:#fcfcfb;--era:#f1f0ec}@media (prefers-color-scheme:dark){.ch-server-failure{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--ink:#f0efec;--ink2:#c3c2b7;--mut:#a3a19a;--grid:#2c2c2a;--axis:#383835;--surf:#1a1a19;--era:#222220}}.ch-server-failure .bg{fill:var(--surf)}.ch-server-failure .era{fill:var(--era)}.ch-server-failure .gr{stroke:var(--grid);stroke-width:1}.ch-server-failure .ax{stroke:var(--axis);stroke-width:1}.ch-server-failure text{fill:var(--ink2);font-size:11.5px}.ch-server-failure .h1{fill:var(--ink);font-size:16px;font-weight:600}.ch-server-failure .h2{fill:var(--ink2);font-size:13px}.ch-server-failure .nt{fill:var(--mut);font-size:12px}.ch-server-failure .lg{fill:var(--ink);font-size:12.5px}.ch-server-failure .tk{fill:var(--mut);font-size:11px}.ch-server-failure .dl{fill:var(--ink);font-size:12px;font-weight:600}.ch-server-failure .s1{stroke:var(--s1)}.ch-server-failure .s2{stroke:var(--s2)}.ch-server-failure .s3{stroke:var(--s3)}.ch-server-failure .f1{fill:var(--s1)}.ch-server-failure .f2{fill:var(--s2)}.ch-server-failure .f3{fill:var(--s3)}.ch-server-failure .srf{fill:var(--surf)}.ch-server-failure .ring{stroke:var(--surf);stroke-width:2}.ch-server-failure .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.ch-server-failure .gap{fill:none;stroke-width:1;opacity:.35}.ch-server-failure .wh{stroke-width:1.5;stroke-linecap:round}.ch-server-failure .wh.weak{stroke-dasharray:3 3;opacity:.45}.ch-server-failure .hit{fill:transparent}.ch-server-failure .pt:focus{outline:none}.ch-server-failure .pt:focus .hit,.ch-server-failure .pt:hover .hit{fill:var(--grid)}</style>
